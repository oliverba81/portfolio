    <rect x="48" y="40" width="1104" height="200" rx="22" fill="#FFFFFF" stroke="#DFE3F5"/>
  </g>
  <text x="88" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5B7CFA" letter-spacing="1.5">OLIVER BARTHEL</text>
  <text x="88" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#232845">18 Projekte · Portfolio-Showcase</text>
  <text x="88" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#7C82A3">Demos, Stack und Architektur — Quellcode bleibt privat</text>
  <rect x="860" y="118" width="250" height="52" rx="14" fill="url(#accent)"/>
  <text x="985" y="151" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Showcase öffnen →</text>
