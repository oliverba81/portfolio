<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Oliver Barthel Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F7FE"/>
      <stop offset="55%" stop-color="#ECEFFC"/>
      <stop offset="100%" stop-color="#E8EDFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B7CFA"/>
      <stop offset="100%" stop-color="#9B7BF7"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4650AA" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="-20" r="160" fill="#DCD6FF" opacity="0.55"/>
  <circle cx="1160" cy="220" r="120" fill="#CFF3E6" opacity="0.55"/>
  <circle cx="70" cy="240" r="90" fill="#FFD9C7" opacity="0.45"/>
